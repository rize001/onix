[package]
name = "onix-messenger"
version = "0.162.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
once_cell = "1.21"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "=1.17.1", default-features = false, features = ["backend-winit", "renderer-software", "unstable-winit-030", "compat-1-2"] }
urlencoding = "2.1"

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
